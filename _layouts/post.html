---
layout: default
---
<article class="post-article">
  <div class="date">{{ page.date | date: "%B %-d, %Y" }}</div>
  <h1>{{ page.title }}</h1>

  {% if page.image %}
  <div class="lead-art">
    <img src="{% include image-src.html src=page.image %}" alt="{{ page.image_alt | default: '' }}">
  </div>
  {% endif %}

  <div class="post-content">
    {{ content }}
  </div>

  <footer class="post-footer">
    <a href="{{ '/writing/' | relative_url }}">&larr; All writing</a>
  </footer>
</article>
