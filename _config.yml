title: "Scott Walters"
tagline: "Systems architect working in HR technology and data strategy."
description: "Working notes on data strategy, HR systems, and the infrastructure behind them."
author: "G. Scott Walters"

# Using the GitHub.io URL while the site is being built.
# When you switch back to gscottwalters.org, change this to "https://gscottwalters.org".
url: "https://gscottwalters.github.io"
baseurl: ""

# Headline shown at the top of the home page. Edit freely.
intro: "Replace this line with your own headline: a sentence or two on who you are and why this blog exists."

# Social icons in the sidebar. An empty value hides that icon.
social:
  github: "https://github.com/gscottwalters"
  linkedin: "https://linkedin.com/in/gscottwalters"
  bluesky: "https://bsky.app/profile/gscottwalters.org"

markdown: kramdown
permalink: /:year/:month/:title.html
timezone: America/Chicago

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
